[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-scratch"
version = "0.1.0"
description = "Descomposiciones QR y Cholesky implementadas desde cero en NumPy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
authors = [{name = "Pablo García Mezcua"}]

[tool.setuptools.packages.find]
where = ["src"]
